<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shaxsiy profil</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px; min-height: 100vh;
    background: #eaf3fb; color: #12304a;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 460px; margin: 0 auto; display: grid; gap: 20px; }
  h1 { font-size: 1.5rem; margin: 0; }

  form {
    background: #fff; border: 1px solid #b9d3e8; border-radius: 16px;
    padding: 20px; display: grid; gap: 12px;
  }
  input {
    width: 100%; padding: 12px 14px; font-size: 1rem;
    border: 1px solid #b9d3e8; border-radius: 10px;
  }
  input:focus { outline: 2px solid #2b7bbf; border-color: transparent; }
  button {
    padding: 12px; font-size: 1rem; font-weight: 600; border: 0;
    border-radius: 10px; background: #2b7bbf; color: #fff; cursor: pointer;
  }
  .err { color: #d64545; font-size: .9rem; min-height: 1.1em; margin: 0; }

  .id {
    background: linear-gradient(135deg, #2b7bbf, #5ba7e0); color: #fff;
    border-radius: 18px; padding: 16px 18px 18px;
    box-shadow: 0 10px 28px rgba(20, 70, 120, .3);
  }
  .id h2 {
    margin: 0 0 12px; font-size: 1rem; letter-spacing: .12em;
    text-transform: uppercase; text-align: center;
    border-bottom: 1px solid rgba(255,255,255,.4); padding-bottom: 10px;
  }
  .row { display: flex; gap: 16px; align-items: center; }
  .ava {
    width: 84px; height: 84px; border-radius: 50%; flex: none;
    background: rgba(255,255,255,.25); border: 2px solid rgba(255,255,255,.7);
    display: grid; place-items: center; font-size: 1.9rem; font-weight: 700;
  }
  .info p { margin: 4px 0; font-size: 1rem; }
  .info span { opacity: .8; }

  .empty {
    color: #5b7890; text-align: center; border: 2px dashed #b9d3e8;
    border-radius: 18px; padding: 28px 16px;
  }
  .clear {
    background: transparent; color: #5b7890; border: 1px solid #b9d3e8;
    font-weight: 500; padding: 8px; font-size: .9rem;
  }
</style>
</head>
<body>
<main>
  <h1>Shaxsiy profil</h1>

  <form id="f" novalidate>
    <input id="ism" placeholder="Ism">
    <input id="fam" placeholder="Familiya">
    <input id="yosh" placeholder="Yosh" inputmode="numeric">
    <p class="err" id="err"></p>
    <button type="submit">Saqlash</button>
  </form>

  <section id="out"></section>
  <button class="clear" id="clr" type="button" hidden>Tozalash</button>
</main>

<script>
  var KEY = "shaxsiy-profil";
  var out = document.getElementById("out");
  var clr = document.getElementById("clr");
  var err = document.getElementById("err");

  function load() {
    try {
      var v = localStorage.getItem(KEY);
      return v ? JSON.parse(v) : null;
    } catch (e) { return null; }
  }

  function save(d) {
    try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {}
  }

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  function render(d) {
    if (!d) {
      out.innerHTML = '<div class="empty">Hozircha profil yo\'q. Ma\'lumotlarni kiriting va «Saqlash»ni bosing.</div>';
      clr.hidden = true;
      return;
    }
    out.innerHTML =
      '<div class="id">' +
        '<h2>ID Karta</h2>' +
        '<div class="row">' +
          '<div class="ava">' + esc((d.ism[0] || "") + (d.fam[0] || "")).toUpperCase() + '</div>' +
          '<div class="info">' +
            '<p><span>Ism:</span> ' + esc(d.ism) + '</p>' +
            '<p><span>Familiya:</span> ' + esc(d.fam) + '</p>' +
            '<p><span>Yosh:</span> ' + esc(d.yosh) + '</p>' +
          '</div>' +
        '</div>' +
      '</div>';
    clr.hidden = false;
  }

  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    var d = {
      ism: ism.value.trim(),
      fam: fam.value.trim(),
      yosh: yosh.value.trim()
    };
    if (!d.ism || !d.fam || !d.yosh) {
      err.textContent = "Barcha maydonlarni to'ldiring.";
      return;
    }
    if (!/^\d{1,3}$/.test(d.yosh)) {
      err.textContent = "Yosh raqam bo'lishi kerak.";
      return;
    }
    err.textContent = "";
    save(d);
    render(d);
  });

  clr.addEventListener("click", function () {
    try { localStorage.removeItem(KEY); } catch (e) {}
    render(null);
    document.getElementById("f").reset();
  });


  var saved = load();
  render(saved);
  if (saved) {
    ism.value = saved.ism;
    fam.value = saved.fam;
    yosh.value = saved.yosh;
  }
</script>
</body>
</html>
